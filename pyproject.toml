[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-verify"
version = "0.3.0"
description = "Verify TRACE claim inclusion proofs against the public registry"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["cryptography>=41.0"]
keywords = ["trace", "merkle", "inclusion-proof", "audit", "ai-governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
signature = ["cryptography>=41.0", "rfc8785>=0.1.2"]

[project.scripts]
trace-verify = "trace_verify.__main__:main"

[project.urls]
Homepage = "https://github.com/agentrust-io/trace-registry"
Documentation = "https://github.com/agentrust-io/trace-registry/blob/main/docs/anchor-format.md"
# trace-registry is a private repository, so its issue tracker returns 404 to
# every reader of this package. Reports land on trace-spec, which is public and
# is where the first external report of a trace-verify defect was filed after the
# reader found nowhere else to put it (trace-spec#138).
"Bug Tracker" = "https://github.com/agentrust-io/trace-spec/issues"
Changelog = "https://github.com/agentrust-io/trace-registry/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_verify"]
