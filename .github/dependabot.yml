version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Majors are reviewed deliberately: this package's only runtime dependency
      # is `cryptography`, and verification behaviour changing under us is worse
      # than being a version behind.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    # One PR per week for minor and patch updates. Majors still arrive
    # one at a time so a breaking change is reviewed on its own.
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # One PR per week for minor and patch updates. Majors still arrive
    # one at a time so a breaking change is reviewed on its own.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
