name: Publish trace-verify to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and attest without publishing to PyPI"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes -r requirements/publish.txt

      - name: Check the tag matches the packaged version
        # Build-only manual runs may use a branch. Every publication must use
        # the tag matching both packaged and runtime versions.
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release) ;;
            workflow_dispatch)
              case "$DRY_RUN" in
                true) exit 0 ;;
                false) TAG="${GITHUB_REF#refs/tags/}" ;;
                *) echo "::error::manual run requires an explicit dry_run value"; exit 1 ;;
              esac
              ;;
            *) echo "::error::unsupported publication event"; exit 1 ;;
          esac
          packaged=$(python -c "import re,pathlib; print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          runtime=$(python -c "import re,pathlib; print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('src/trace_verify/__init__.py').read_text(), re.M).group(1))")
          echo "tag=$TAG pyproject=$packaged __version__=$runtime"
          test "$GITHUB_REF" = "refs/tags/v$packaged" || { echo "::error::publication requires refs/tags/v$packaged"; exit 1; }
          test "$TAG" = "v$packaged" || { echo "::error::tag $TAG does not match pyproject version $packaged"; exit 1; }
          test "$runtime" = "$packaged" || { echo "::error::__version__ $runtime does not match pyproject version $packaged"; exit 1; }

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate artifacts
        run: |
          twine check dist/*
          ls -lh dist/

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
