name: Publish trace-verify to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify artifacts without publishing to PyPI"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: validate
    if: success() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install --require-hashes -r requirements/ci.txt -r requirements/publish.txt

      - name: Check the tag matches the packaged version
        # Build-only manual runs may use a branch. Every publication must use
        # the tag matching both packaged and runtime versions.
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release) ;;
            workflow_dispatch)
              case "$DRY_RUN" in
                true) exit 0 ;;
                false) TAG="${GITHUB_REF#refs/tags/}" ;;
                *) echo "::error::manual run requires an explicit dry_run value"; exit 1 ;;
              esac
              ;;
            *) echo "::error::unsupported publication event"; exit 1 ;;
          esac
          packaged=$(python -c "import re,pathlib; print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          runtime=$(python -c "import re,pathlib; print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('src/trace_verify/__init__.py').read_text(), re.M).group(1))")
          echo "tag=$TAG pyproject=$packaged __version__=$runtime"
          test "$GITHUB_REF" = "refs/tags/v$packaged" || { echo "::error::publication requires refs/tags/v$packaged"; exit 1; }
          test "$TAG" = "v$packaged" || { echo "::error::tag $TAG does not match pyproject version $packaged"; exit 1; }
          test "$runtime" = "$packaged" || { echo "::error::__version__ $runtime does not match pyproject version $packaged"; exit 1; }

      - name: Build wheel and sdist
        run: python -m build --no-isolation

      - name: Validate artifacts
        run: |
          twine check dist/*
          ls -lh dist/

      - name: Verify installed wheel and sdist
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          source_root="$PWD"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          for artifact in "${wheels[@]}" "${sdists[@]}"; do
            artifact_path="$source_root/$artifact"
            check_dir=$(mktemp -d)
            python -m venv "$check_dir/venv"
            "$check_dir/venv/bin/python" -m pip install --require-hashes \
              -r requirements/ci.txt -r requirements/runtime.txt
            # hatchling and its dependencies are locked above; rebuilding the
            # sdist cannot fetch an unpinned backend through build isolation.
            "$check_dir/venv/bin/python" -m pip install --no-deps --no-build-isolation "$artifact_path"
            (
              cd "$check_dir"
              "$check_dir/venv/bin/python" -I "$source_root/tools/check_installed_artifact.py" \
                "$source_root" "$version"
            )
          done

      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace-verify-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [validate, build]
    if: >-
      success() && needs.validate.result == 'success' && needs.build.result == 'success' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trace-verify-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
