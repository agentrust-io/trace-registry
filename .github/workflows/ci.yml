name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements/ci.txt

      - name: Install offline witness verification dependencies
        run: pip install --require-hashes -r requirements/witness.txt

      - name: Install trace-verify package (editable)
        # The signature extra, not the bare package: the pre-image is RFC 8785
        # and verify_signature now refuses to guess at it rather than falling
        # back to a canonicalization that only agrees on ASCII. Without the
        # extra the smoke test below exercises a path that hard-fails by design.
        # Third-party dependencies come from the hash-pinned lock first; the
        # local package then goes in with --no-deps, because pip cannot
        # hash-pin an editable install in the same invocation.
        run: |
          pip install --require-hashes -r requirements/runtime.txt
          pip install --no-deps -e ".[signature]"

      - name: Smoke-test trace-verify CLI
        run: |
          set -euo pipefail
          trace-verify --version
          trace-verify \
            --claim samples/example-trust-record.json \
            --proof samples/inclusion-proof.json \
            --entry registry/2026/06/12.ndjson
          trace-verify \
            --claim samples/example-trust-record.json \
            --proof samples/inclusion-proof.json \
            --entry registry/2026/06/12.ndjson \
            --json | python -c "import json,sys; r=json.load(sys.stdin); assert r['verified'], r"
          # The other two questions the CLI answers, run the way a reader
          # who only ran `pip install` runs them. Both were reachable
          # solely by cloning this repository until 0.4.0, so a regression
          # here is a regression in what a third party can check without
          # our tree.
          trace-verify chain registry/2026/06/12.ndjson registry/2026/09/01.ndjson
          trace-verify chain registry/2026/09/01.ndjson \
            --json | python -c "import json,sys; r=json.load(sys.stdin); assert r['verified'] and r['checkpoints'] == 1, r"
          trace-verify receipt \
            --checkpoint docs/evidence/witness-2026-09-07/checkpoint-1.json \
            --response docs/evidence/witness-2026-09-07/witness-post.json \
            --expected-log-id trace-registry/v1 \
            --registry-key bc133259c094f63694b4ec48a295d7501a9a0cd536df5631fb4663c155f7bc90 \
            --witness-key 39bb654c9dc0afe1c0edef0deffaa69099b8518836c9ba26e0491535840f96b5 \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['verified'] and r['leaf_index'] == 936, r"

      - name: Determine base SHA for append-only check
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check registry is append-only
        if: steps.base.outputs.sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python tools/check_append_only.py "$BASE_SHA"

      - name: Validate registry entries against schema
        run: python tools/validate_registry.py

      - name: Validate producer key files
        run: python tools/validate_producers.py

      - name: Run tool tests
        run: python -m unittest discover -s tests -v

      - name: Round-trip the sample anchor
        run: |
          set -euo pipefail
          # Re-anchor the committed sample claim and check the recomputed
          # Merkle root matches the committed registry entry.
          recomputed=$(python tools/anchor.py samples/example-trust-record.json \
              --producer ci --proof-dir "$(mktemp -d)" \
              | python -c "import json,sys; print(json.load(sys.stdin)['merkle_root'])")
          committed=$(python -c "import json; print(json.loads(open('registry/2026/06/12.ndjson').readline())['merkle_root'])")
          echo "recomputed: $recomputed"
          echo "committed:  $committed"
          test "$recomputed" = "$committed"
          # Verify the committed inclusion proof against the committed entry.
          python tools/verify_inclusion.py \
            --claim samples/example-trust-record.json \
            --proof samples/inclusion-proof.json \
            --entry registry/2026/06/12.ndjson

      - name: Check for required files
        run: |
          for f in LICENSE README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md; do
            [ -f "$f" ] || { echo "Missing required file: $f"; exit 1; }
          done
          echo "All required community health files present"
